groups:
  - name: linux-alertas
    rules:
      - alert: AltaCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU acima de 80% em {{ $labels.instance }}"
          runbook: "runbooks/alta-cpu.md"

      - alert: AltaMemoria
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memória acima de 90% em {{ $labels.instance }}"

      - alert: DiscoQuaseCheio
        expr: (1 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"})) * 100 > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disco acima de 85% em {{ $labels.instance }} ({{ $labels.mountpoint }})"
          runbook: "runbooks/disco-cheio.md"

      - alert: ServicoForaDoAr
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Alvo {{ $labels.job }} ({{ $labels.instance }}) fora do ar"
          runbook: "runbooks/servico-fora.md"
